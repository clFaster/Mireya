name: PR Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: |
          dotnet restore ./src/Mireya.Api/Mireya.Api.csproj
          dotnet restore ./src/Mireya.Client.Desktop/Mireya.Client.Desktop.csproj
          dotnet restore ./src/Mireya.ApiClient/Mireya.ApiClient.csproj
          dotnet restore ./src/Mireya.Application.Tests/Mireya.Application.Tests.csproj

      - name: Build backend API
        run: dotnet build ./src/Mireya.Api/Mireya.Api.csproj --configuration Release --no-restore

      - name: Build API client
        run: dotnet build ./src/Mireya.ApiClient/Mireya.ApiClient.csproj --configuration Release --no-restore

      - name: Build Avalonia client
        run: dotnet build ./src/Mireya.Client.Desktop/Mireya.Client.Desktop.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./src/Mireya.Application.Tests/Mireya.Application.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore
