name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (for example 1.0.0 or 1.0.0-rc.1)"
        required: true
        type: string
      publish_latest:
        description: "Promote this stable version to the 1, 1.0, and latest tags"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: moritzreis/mireya-digital-signage

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    env:
      MIREYA_IMAGE: mireya
      MIREYA_VERSION: smoke
      MIREYA_HTTP_PORT: "8080"
      POSTGRES_DB: mireya
      POSTGRES_USER: mireya
      POSTGRES_PASSWORD: smoke-test-database-password
      MIREYA_ADMIN_EMAIL: admin@mireya.local
      MIREYA_ADMIN_PASSWORD: smoke-test-admin-password-1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve image version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PROMOTE_STABLE: ${{ github.event_name == 'push' || inputs.publish_latest }}
        run: |
          version="${REQUESTED_VERSION#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ ! "$version" =~ $semver_pattern ]]; then
            echo "::error::Version '$version' is not a supported Semantic Version."
            exit 1
          fi

          stable=false
          floating=false
          major=
          major_minor=

          if [[ "$version" != *-* ]]; then
            stable=true
            IFS=. read -r major minor patch <<< "$version"
            major_minor="$major.$minor"

            if [[ "$PROMOTE_STABLE" == "true" ]]; then
              floating=true
            fi
          else
            prerelease="${version#*-}"
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "::error::Numeric pre-release identifiers must not contain leading zeroes."
                exit 1
              fi
            done
          fi

          {
            echo "version=$version"
            echo "stable=$stable"
            echo "floating=$floating"
            echo "major=$major"
            echo "major_minor=$major_minor"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: mireya:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test with PostgreSQL
        run: |
          docker compose up --detach --wait --wait-timeout 180
          curl --fail --silent --show-error "http://localhost:${MIREYA_HTTP_PORT}/health"
          curl --fail --silent --show-error \
            "http://localhost:${MIREYA_HTTP_PORT}/_framework/blazor.web.js" > /dev/null
          admin_count="$(docker compose exec -T db \
            psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM \"AspNetUsers\" WHERE \"Email\" = '$MIREYA_ADMIN_EMAIL';")"
          test "$admin_count" = "1"

      - name: Show smoke-test logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop smoke-test stack
        if: always()
        run: docker compose down --volumes

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.floating }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.floating }}
            type=raw,value=latest,enable=${{ steps.version.outputs.floating }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Mireya Digital Signage
            org.opencontainers.image.description=Mireya digital-signage backend and administration UI
            org.opencontainers.image.source=https://github.com/clFaster/Mireya
            org.opencontainers.image.documentation=https://mireya.moritzreis.dev
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
