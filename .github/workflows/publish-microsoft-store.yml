name: Publish Microsoft Store

on:
  workflow_call:
    inputs:
      version:
        description: "Stable semantic version to package (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-microsoft-store
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  AVALONIA_TELEMETRY_OPTOUT: true

jobs:
  package-and-publish:
    name: Package and publish
    runs-on: windows-latest
    environment: stable
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION -replace '^v', ''

          if ($version -match '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            $parts = $version.Split('.') | ForEach-Object { [int] $_ }
            if ($parts[0] -gt 65535 -or $parts[1] -gt 65535 -or $parts[2] -gt 65535) {
              Write-Host "::error::Version '$version' cannot be represented as a Microsoft Store package version."
              exit 1
            }

            # Keep the fourth component at zero for Store assignment.
            $packageVersion = '{0}.{1}.{2}.0' -f $parts[0], $parts[1], $parts[2]
            "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          Write-Host "::error::Version '$version' must be a stable Semantic Version."
          exit 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build Store-ready MSIX bundle
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          $packageProject = Join-Path $env:GITHUB_WORKSPACE 'src\Mireya.Client.Desktop.Package\Mireya.Client.Desktop.Package.wapproj'
          $packageManifest = Join-Path $env:GITHUB_WORKSPACE 'src\Mireya.Client.Desktop.Package\Package.appxmanifest'
          $desktopProject = Join-Path $env:GITHUB_WORKSPACE 'src\Mireya.Client.Desktop\Mireya.Client.Desktop.csproj'
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\microsoft-store\package'
          $bundleArtifactsDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\microsoft-store\bundle-artifacts'
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $bundleArtifactsDirectory -Force | Out-Null

          $bundlePlatforms = 'x64|ARM64'

          # The WAP targets use the Identity version from Package.appxmanifest;
          # AppxPackageVersion alone does not replace the embedded value.
          [xml] $manifest = Get-Content -LiteralPath $packageManifest -Raw
          $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if ($null -eq $identity) {
            throw "Package identity was not found in '$packageManifest'."
          }

          $identity.SetAttribute('Version', $env:PACKAGE_VERSION)
          $manifest.Save($packageManifest)

          $restoreArguments = @(
            $packageProject
            '/t:Restore'
            '/m:1'
            '/p:BuildInParallel=false'
            '/p:BuildWindowsMsixBundle=true'
            '/p:Configuration=Release'
            '/p:Platform=x64'
          )
          & msbuild @restoreArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Packaging project restore failed with exit code $LASTEXITCODE."
          }

          # RuntimeIdentifiers in the desktop project restores both runtime graphs.
          & dotnet restore $desktopProject `
            --disable-parallel `
            --property:BuildWindowsMsixBundle=true `
            --property:Configuration=Release
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop runtime restore failed with exit code $LASTEXITCODE."
          }

          # DesktopBridge orchestrates both platform builds and then creates one bundle.
          $buildArguments = @(
            $packageProject
            '/m:1'
            '/p:BuildInParallel=false'
            '/p:BuildWindowsMsixBundle=true'
            '/p:UseSharedCompilation=false'
            '/p:SkipNSwag=true'
            '/p:Configuration=Release'
            '/p:Platform=x64'
            '/p:AppxBundle=Always'
            "/p:AppxBundlePlatforms=$bundlePlatforms"
            '/p:AppxPackageSigningEnabled=false'
            "/p:AppxPackageDir=$packageDirectory\"
            "/p:PlatformSpecificBundleArtifactsListDir=$bundleArtifactsDirectory\"
            "/p:AppxPackageVersion=$env:PACKAGE_VERSION"
            "/p:Version=$env:RELEASE_VERSION"
            "/p:FileVersion=$env:PACKAGE_VERSION"
            "/p:AssemblyVersion=$env:PACKAGE_VERSION"
          )
          & msbuild @buildArguments
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          $bundles = @(Get-ChildItem -LiteralPath $packageDirectory -Filter '*.msixbundle' -File -Recurse)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one MSIX bundle, found $($bundles.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($bundles[0].FullName)
          try {
            $manifestEntry = $archive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if ($null -eq $manifestEntry) {
              throw "The generated MSIX bundle does not contain AppxBundleManifest.xml."
            }

            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try {
              [xml] $builtManifest = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }

            $builtIdentity = $builtManifest.SelectSingleNode("/*[local-name()='Bundle']/*[local-name()='Identity']")
            if ($null -eq $builtIdentity) {
              throw "The generated MSIX bundle manifest does not contain an identity."
            }

            $builtVersion = $builtIdentity.GetAttribute('Version')
            if ($builtVersion -ne $env:PACKAGE_VERSION) {
              throw "Expected MSIX bundle version '$env:PACKAGE_VERSION', found '$builtVersion'."
            }

            $applicationPackages = @(
              $builtManifest.SelectNodes("/*[local-name()='Bundle']/*[local-name()='Packages']/*[local-name()='Package']") |
                Where-Object { $_.GetAttribute('Type').ToLowerInvariant() -eq 'application' }
            )
            $actualArchitectures = @(
              $applicationPackages |
                ForEach-Object { $_.GetAttribute('Architecture').ToLowerInvariant() } |
                Sort-Object -Unique
            )
            $expectedArchitectures = @('arm64', 'x64')
            if (($actualArchitectures -join ',') -ne ($expectedArchitectures -join ',')) {
              throw "Expected application packages for '$($expectedArchitectures -join ', ')', found '$($actualArchitectures -join ', ')'."
            }

            foreach ($applicationPackage in $applicationPackages) {
              $applicationPackageVersion = $applicationPackage.GetAttribute('Version')
              if ($applicationPackageVersion -ne $env:PACKAGE_VERSION) {
                throw "Expected $($applicationPackage.GetAttribute('Architecture')) package version '$env:PACKAGE_VERSION', found '$applicationPackageVersion'."
              }
            }

            Write-Host "Verified MSIX bundle version $builtVersion with x64 and ARM64 application packages."
          }
          finally {
            $archive.Dispose()
          }

          "msixbundle_path=$($bundles[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Store package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mireya-microsoft-store-${{ steps.version.outputs.version }}
          path: artifacts/microsoft-store/package/**/*.msixbundle
          if-no-files-found: error
          retention-days: 30

      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          AZURE_AD_APP_REGISTRATION_CLIENT_ID: ${{ secrets.AZURE_AD_APP_REGISTRATION_CLIENT_ID }}
          AZURE_AD_APP_REGISTRATION_CLIENT_SECRET: ${{ secrets.AZURE_AD_APP_REGISTRATION_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:AZURE_AD_APP_REGISTRATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APP_REGISTRATION_CLIENT_SECRET

      - name: Publish package to Microsoft Store
        shell: pwsh
        env:
          MSIX_BUNDLE_PATH: ${{ steps.package.outputs.msixbundle_path }}
          STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
        run: |
          msstore publish "$env:MSIX_BUNDLE_PATH" -id "$env:STORE_APP_ID"
