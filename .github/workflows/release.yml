name: Release Mireya

on:
  workflow_dispatch:
    inputs:
      # Versioning
      skip-update:
        type: boolean
        description: "Skip the version update step"
        required: true
        default: false
      release-type:
        type: choice
        description: Which type of release to create?
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      
      # Docker
      publish_docker:
        description: "Release the Docker image"
        required: true
        default: true
        type: boolean

      # Google Play
      publish_google_play:
        description: "Release the Android App"
        required: true
        default: true
        type: boolean

      # Microsoft Store
      publish_microsoft_store:
        description: "Release the Microsoft Store package"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-mireya
  cancel-in-progress: false

jobs:
  update-version:
    name: "Update Mireya Version"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      new_version: ${{ steps.resolve_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Ensure branch is main
        if: github.ref != 'refs/heads/main'
        run: |
          text="Publish a new version of Mireya can only be done from the main branch."
          echo "::error title=Wrong Branch::$text"
          exit 1

      - name: Read current version
        run: |
          echo "Current version: ${{ vars.VERSION }}"

      - name: Resolve release version
        id: resolve_version
        env:
          CURRENT_VERSION: ${{ vars.VERSION }}
          INCREMENT: ${{ inputs.release-type }}
          SKIP_UPDATE: ${{ inputs.skip-update }}
        run: |
          if [[ ! "$CURRENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::VERSION '$CURRENT_VERSION' is not a valid semantic version."
            exit 1
          fi

          if [ "$SKIP_UPDATE" = "true" ]; then
            new_version="$CURRENT_VERSION"
          else
            IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

            case "$INCREMENT" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "::error::Invalid release type '$INCREMENT'."
                exit 1
                ;;
            esac

            new_version="$major.$minor.$patch"
          fi

          echo "New version: $new_version"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Update version var
        id: write_version
        if: ${{ github.event.inputs.skip-update == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.VAR_UPDATE_GITHUB }}
        run: |
          gh variable set VERSION --body "${{ steps.resolve_version.outputs.new_version }}"

  docker:
    name: Docker
    needs: update-version
    if: inputs.publish_docker
    uses: ./.github/workflows/publish-docker.yml
    with:
      version: ${{ needs.update-version.outputs.new_version }}
    secrets: inherit

  google-play:
    name: Google Play
    needs: update-version
    if: inputs.publish_google_play
    uses: ./.github/workflows/publish-google-play.yml
    with:
      version: ${{ needs.update-version.outputs.new_version }}
    secrets: inherit

  microsoft-store:
    name: Microsoft Store
    needs: update-version
    if: inputs.publish_microsoft_store
    uses: ./.github/workflows/publish-microsoft-store.yml
    with:
      version: ${{ needs.update-version.outputs.new_version }}
    secrets: inherit


  create-release:
    runs-on: ubuntu-latest
    needs:
      - update-version
    permissions:
      contents: write

    steps:
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.update-version.outputs.new_version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Refusing to create a release with invalid version '$RELEASE_VERSION'."
            exit 1
          fi

          RELEASE_TAG="v$RELEASE_VERSION"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes
          fi
