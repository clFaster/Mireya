name: Release Mireya

on:
  workflow_dispatch:
    inputs:
      # Versioning
      skip-update:
        type: boolean
        description: "Skip the version update step"
        required: true
        default: false
      release-type:
        type: choice
        description: Which type of release to create?
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      
      # Docker
      publish_docker:
        description: "Build and smoke-test the Docker image"
        required: true
        default: true
        type: boolean

      # Google Play
      publish_google_play:
        description: "Build the Android app bundle"
        required: true
        default: true
        type: boolean

      # Microsoft Store
      publish_microsoft_store:
        description: "Build the Microsoft Store package"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-mireya
  cancel-in-progress: false

jobs:
  update-version:
    name: "Update Mireya Version"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Ensure branch is main
        if: github.ref != 'refs/heads/main'
        run: |
          text="Publish a new version of Mireya can only be done from the main branch."
          echo "::error title=Wrong Branch::$text"
          exit 1

      - name: Read current version
        run: |
          echo "Current version: ${{ vars.VERSION }}"

      - name: Bump version
        id: bump_version
        if: ${{ github.event.inputs.skip-update == 'false' }}
        run: |
          # Retrieve the increment type from the GitHub Actions input
          increment="${{ inputs.release-type }}"
          
          # Split the VERSION variable into its major, minor, and patch components
          IFS='.' read -r -a parts <<< "${{ vars.VERSION }}"
          
          # Check if the VERSION variable was split correctly
          if [ "${#parts[@]}" -ne 3 ]; then
          echo "Invalid version format"
          exit 1
          fi
          
          major=${parts[0]}
          minor=${parts[1]}
          patch=${parts[2]}
          
          # Increment the appropriate version component
          if [ "$increment" = "major" ]; then
          major=$((major + 1))
          minor=0
          patch=0
          elif [ "$increment" = "minor" ]; then
          minor=$((minor + 1))
          patch=0
          elif [ "$increment" = "patch" ]; then
          patch=$((patch + 1))
          else
          echo "Invalid increment type"
          exit 1
          fi
          
          # Construct the new version string
          new_version="$major.$minor.$patch"
          
          # Output the new version
          echo "New version: $new_version"
          
          # Set the output variable for GitHub Actions
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Update version var
        id: write_version
        if: ${{ github.event.inputs.skip-update == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.VAR_UPDATE_GITHUB }}
        run: |
          gh variable set VERSION --body "${{ steps.bump_version.outputs.new_version }}"

  docker:
    name: Docker
    needs: update-version
    if: inputs.publish_docker
    uses: ./.github/workflows/publish-docker.yml
    with:
      version: ${{ needs.update-version.outputs.new_version }}
    secrets: inherit

  google-play:
    name: Google Play
    needs: update-version
    if: inputs.publish_google_play
    uses: ./.github/workflows/publish-google-play.yml
    with:
      version: ${{ needs.update-version.outputs.new_version }}
    secrets: inherit

  microsoft-store:
    name: Microsoft Store
    needs: update-version
    if: inputs.publish_microsoft_store
    uses: ./.github/workflows/publish-microsoft-store.yml
    with:
      version: ${{ needs.update-version.outputs.new_version }}
    secrets: inherit


  create-release:
    runs-on: ubuntu-latest
    needs:
      - update-version
    permissions:
      contents: write

    steps:
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: "v${{ needs.update-version.outputs.new_version }}"
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes
          fi

          shopt -s nullglob

          gh release upload "$RELEASE_TAG" --clobber