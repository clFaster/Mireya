name: mireya

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mireya}
      POSTGRES_USER: ${POSTGRES_USER:-mireya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - mireya-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    image: ${MIREYA_IMAGE:-moritzreis/mireya-digital-signage}:${MIREYA_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${MIREYA_FORWARDED_HEADERS_ENABLED:-true}
      provider: Postgres
      ConnectionStrings__Postgres: "Host=db;Database=${POSTGRES_DB:-mireya};Username=${POSTGRES_USER:-mireya};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      DefaultAdminUser__Email: ${MIREYA_ADMIN_EMAIL:-admin@mireya.local}
      DefaultAdminUser__Password: ${MIREYA_ADMIN_PASSWORD:?Set MIREYA_ADMIN_PASSWORD in .env}
    ports:
      - "${MIREYA_HTTP_PORT:-8080}:8080"
    volumes:
      - mireya-uploads:/app/uploads
      - mireya-keys:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  mireya-db:
  mireya-uploads:
  mireya-keys:
